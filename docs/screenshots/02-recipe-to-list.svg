font-family="DejaVu Sans,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#221A16" font-weight="bold" text-anchor="start">Ingredients</text><text x="50" y="310" font-family="DejaVu Sans,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#221A16" font-weight="normal" text-anchor="start">•  400 g spaghetti</text><text x="50" y="334" font-family="DejaVu Sans,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#221A16" font-weight="normal" text-anchor="start">•  2 lemon</text><text x="50" y="358" font-family="DejaVu Sans,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#221A16" font-weight="normal" text-anchor="start">•  4 tbsp olive oil</text><text x="50" y="382" font-family="DejaVu Sans,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#221A16" font-weight="normal" text-anchor="start">•  80 g parmesan</text><text x="50" y="406" font-family="DejaVu Sans,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#221A16" font-weight="normal" text-anchor="start">•  4 tbsp chopped parsley</text><rect x="50" y="444" width="300" height="44" rx="22" ry="22" fill="none" stroke="#85736C" stroke-width="1"/><g transform="translate(74,457) scale(0.85)" fill="none" stroke="#9A4522" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0h3l2.4 12.2a2 2 0 0 0 2 1.6h9.3a2 2 0 0 0 2-1.6L20.5 4H4"/><circle cx="8" cy="19" r="1.7"/><circle cx="17" cy="19" r="1.7"/></g><text x="210" y="471" font-family="DejaVu Sans,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#9A4522" font-weight="500" text-anchor="middle">Add ingredients to grocery list</text><rect x="50" y="510" width="300" height="1" rx="0" ry="0" fill="#D8C2BA"/><text x="50" y="540" font-family="DejaVu Sans,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#221A16" font-weight="bold" text-anchor="start">Method</text><text x="50" y="566" font-family="DejaVu Sans,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#221A16" font-weight="normal" text-anchor="start">1. Cook the pasta until al dente, reserving</text><text x="50" y="586" font-family="DejaVu Sans,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#221A16" font-weight="normal" text-anchor="start">a cup of pasta water.</text><text x="50" y="610" font-family="DejaVu Sans,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#221A16" font-weight="normal" text-anchor="start">2. Whisk lemon zest, juice, olive oil, and</text><text x="50" y="630" font-family="DejaVu Sans,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#221A16" font-weight="normal" text-anchor="start">parmesan in a warm pan.</text><rect x="244" y="714" width="106" height="42" rx="21" ry="21" fill="#9A4522"/><text x="297" y="741" font-family="DejaVu Sans,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#FFFFFF" font-weight="500" text-anchor="middle">Done</text><rect x="0" y="880" width="400" height="62" rx="0" ry="0" fill="#3A322E"/><text x="200.0" y="904" font-family="DejaVu Sans,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#FFD9C6" font-weight="bold" text-anchor="middle">RENDER - not an emulator capture</text><text x="200.0" y="923" font-family="DejaVu Sans,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#FFF3EC" font-weight="normal" text-anchor="middle">Recipe detail: ingredients scale with servings, then go to the list.</text></svg>